[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DataYee"
version = "1.0.1"
description = "DataYee force-curve analysis application"
readme = "README.md"
requires-python = ">=3.10,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
    "PyQt5>=5.15",
    "xlwt>=1.3.0",
    "openpyxl>=3.1",
    "jpkfile==1.6.1",
    "dtaidistance>=2.4.0",
    "tslearn",
    "Pillow>=9.2,<12.0",
    "decorator>=4.0.2,<6.0",
    "imageio>=2.5,<3.0",
    "python-dotenv>=0.10",
    "requests",
    "torch",
    "torchvision",
    "torchaudio",
]

[project.scripts]
datayee = "datayee.cli:main"

[tool.setuptools]
include-package-data = true
py-modules = ["UI"]

[tool.setuptools.packages.find]
where = ["."]
include = ["datayee*", "src*", "plot*"]

[tool.setuptools.package-data]
src = ["*.ui", "*.pkl", "shared-data/*"]

# Models and icons are kept at the project root for compatibility with the
# existing source tree and installed under the environment's DataYee folder.
[tool.setuptools.data-files]
"DataYee/model" = ["model/*"]
"DataYee/source" = ["source/*"]
